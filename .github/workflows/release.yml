name: Release

# Publishing is tied to a version tag, never to a branch push. Pushing a commit
# to main must not attempt to republish a version that already exists.
on:
  push:
    tags: ["v*"]

# Two tags pushed back to back must not race each other to RubyGems.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # A tag that disagrees with the gemspec publishes the wrong version under
      # the right name, which cannot be undone once it is on RubyGems.
      - name: Verify tag matches gemspec version
        run: |
          gem_version="$(ruby -Ilib -e 'require "abacate_pay/version"; print AbacatePay::VERSION')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$gem_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match AbacatePay::VERSION (${gem_version})"
            exit 1
          fi
          echo "Releasing ${gem_version}"

      - name: Run specs
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop --format github

  publish:
    name: Publish to RubyGems
    needs: verify
    runs-on: ubuntu-latest
    environment: rubygems

    permissions:
      contents: read
      # Required for RubyGems Trusted Publishing: the runner mints a short-lived
      # OIDC token instead of carrying a long-lived API key in a repo secret.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Exchanges the OIDC token for a scoped, short-lived RubyGems credential.
      # Requires a trusted publisher configured at:
      # https://rubygems.org/gems/abacatepay-ruby/trusted_publishers
      #
      # Actions in this job are pinned by commit SHA, not by tag: this job holds
      # id-token: write, which is the gem's publishing credential, and a tag can
      # be repointed by whoever maintains the action. Dependabot keeps the SHAs
      # current and rewrites the trailing version comment.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Build gem
        run: gem build abacatepay-ruby.gemspec

      - name: Push gem
        run: gem push abacatepay-ruby-*.gem

  github_release:
    name: Publish GitHub Release
    # Only after the gem is on RubyGems, so a release never announces a version
    # nobody can install.
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      # Creating a release writes to the repository.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Attached so the gem can be installed without going through RubyGems.
      - name: Build gem
        run: gem build abacatepay-ruby.gemspec

      # The section for this version in CHANGELOG.md becomes the release notes,
      # so the two can never drift apart.
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { collecting = 1; next }
            collecting && /^## \[/   { exit }
            collecting               { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for ${version}"
            exit 1
          fi
          echo "Release notes for ${version}:"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            abacatepay-ruby-*.gem
